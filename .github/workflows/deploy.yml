name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação de cada vez; não cancela uma que já esteja a correr.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verificar-e-construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verificação de tipos
        run: npm run typecheck

      - name: Testes unitários
        run: npm test

      - name: Build
        env:
          # A aplicação é servida em https://<utilizador>.github.io/<repositório>/
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Fallback de SPA
        # O GitHub Pages não reescreve rotas: servir o index.html no 404 faz com
        # que abrir /calendario diretamente funcione.
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
        with:
          # Liga o Pages automaticamente se ainda não estiver ligado.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: verificar-e-construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
